---
# tasks alta_usuarios_Ryodan

- name: Asegurar que exista el grupo secundario del equipo
  group:
    name: "{{ Nombre_Grupo }}"
    state: present

- name: Crear usuario R1
  user:
    name: "{{ Integrantes[0].nombre | lower | regex_replace(' ', '_') }}"
    comment: "{{ Integrantes[0].nombre }} {{ Integrantes[0].apellido }}"
    group: "{{ Integrantes[0].rol | lower }}"
    groups: "{{ Nombre_Grupo }}"
    append: yes
    password: "{{ 'vagrant' | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes

